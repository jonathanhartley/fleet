defaultNamespace: pulsar-fleet

targetCustomizations:
- name: dev
  helm:
    repo: https://helm.familyhartley.com
    chart: pulsar-helmprep
    version: 0.0.10
    releaseName: pulsar-helmprep
    values:
      image:
        repository: docker.familyhartley.com/pulsar/pulsar-helmprep
        tag: 0.0.10

      fullnameOverride: "pulsar-1a-helmprep"

      pulsarConfig:
        clusterName: pulsar-1a
  clusterSelector:
    matchLabels:
      env: dev
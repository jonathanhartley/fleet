defaultNamespace: pulsar
dependsOn: 
  - name: fleet-cert-manager
  - name: fleet-pulsar-helmprep

targetCustomizations:
- name: dev
  helm:
    repo: https://helm.familyhartley.com
    chart: pulsar
    version: 4.4.0
    releaseName: pulsar-1a
    disableDependencyUpdate: true
    valuesFiles:
      - dev.yaml
  clusterSelector:
    matchLabels:
      env: dev

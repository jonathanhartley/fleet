defaultNamespace: nfs-csi

targetCustomizations:
- name: dev
  helm:
    chart: https://helm.familyhartley.com/csi-driver-nfs-4.12.1.tgz
    values:
      storageClass:
        create: true
        name: nfs
        parameters:
          server: 192.168.3.250
          share: /volume1/kubernetes
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        mountOptions:
          - nfsvers=4
  clusterSelector:
    matchLabels:
      env: dev

- name: prod
  helm:
    chart: https://helm.familyhartley.com/csi-driver-nfs-4.12.1.tgz
    values:
      storageClass:
        create: true
        name: nfs
        parameters:
          server: 192.168.3.250
          share: /volume1/kubernetes
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        mountOptions:
          - nfsvers=4
  clusterSelector:
    matchLabels:
      env: prod